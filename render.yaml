databases:
  - name: coincheckdb
    databaseName: coincheckdb
    user: coincheckuser

services:
  - type: web
    name: coincheckindia-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coincheckdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4